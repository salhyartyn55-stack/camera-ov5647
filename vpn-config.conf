# ================================================
# VPN Configuration File
# ================================================
# تنظیمات VPN برای اتصالات امن
# ================================================

# ================================================
# 1. OpenVPN Configuration
# ================================================
[OPENVPN]
enabled = true
protocol = udp              # udp یا tcp
port = 1194                 # پورت OpenVPN
ca_cert = /path/to/ca.crt
client_cert = /path/to/client.crt
client_key = /path/to/client.key
tls_auth = /path/to/ta.key
cipher = AES-256-CBC        # رمزنگاری
auth = SHA256               # احراز هویت
comp_lzo = yes              # فشرده‌سازی
keepalive = 10 120          # نگاه‌دارندگی اتصال
persist_key = true
persist_tun = true
verb = 3                    # سطح Logging

# ================================================
# 2. WireGuard Configuration
# ================================================
[WIREGUARD]
enabled = false
interface = wg0
private_key = [YOUR_PRIVATE_KEY]
public_key = [YOUR_PUBLIC_KEY]
address = 10.0.0.2/24       # آدرس IP
listen_port = 51820

# Peer (سرور)
peer_public_key = [SERVER_PUBLIC_KEY]
endpoint = vpn.example.com:51820
allowed_ips = 0.0.0.0/0
persistent_keepalive = 25

# ================================================
# 3. Shadowsocks Configuration
# ================================================
[SHADOWSOCKS]
enabled = false
server = vpn.example.com
server_port = 8388
local_port = 1080
password = your_password
method = aes-256-gcm        # رمزنگاری
timeout = 300               # زمان انتظار
fast_open = true

# ================================================
# 4. تنظیمات کلی VPN
# ================================================
[GENERAL]
vpn_type = openvpn          # نوع VPN: openvpn, wireguard, shadowsocks
auto_connect = true         # اتصال خودکار
reconnect = true            # دوباره اتصال
reconnect_interval = 60     # بازه دوباره اتصال (ثانیه)
max_retries = 5             # حداکثر تلاش
kill_switch = true          # قطع اتصال اگر VPN قطع شود
dns_leak_protection = true  # حفاظت از نشتِ DNS
logging = true              # ثبت گزارش

# ================================================
# 5. تنظیمات DNS
# ================================================
[DNS]
use_vpn_dns = true
primary_dns = 8.8.8.8       # Google DNS
secondary_dns = 1.1.1.1     # Cloudflare DNS
# برای OpenVPN
openvpn_dns = 10.8.0.1

# ================================================
# 6. تنظیمات Routing
# ================================================
[ROUTING]
route_all_traffic = true    # تمام ترافیک از طریق VPN
split_tunneling = false     # جداسازی تونل
bypass_vpn_apps = []        # اپلیکیشن‌های بدون VPN
vpn_only_apps = []          # اپلیکیشن‌های فقط با VPN

# ================================================
# 7. تنظیمات Security
# ================================================
[SECURITY]
tls_version = 1.3           # نسخه TLS
certificate_pinning = false
verify_hostname = true      # تأیید نام میزبان
allow_insecure = false      # عدم اجازه بدون سرتیفیکت

# ================================================
# 8. تنظیمات Proxy
# ================================================
[PROXY]
use_proxy = false
proxy_type = http           # http, socks5, socks4
proxy_host = proxy.example.com
proxy_port = 8080
proxy_username = username
proxy_password = password

# ================================================
# 9. تنظیمات Logging
# ================================================
[LOGGING]
log_file = /var/log/vpn.log
log_level = INFO            # DEBUG, INFO, WARNING, ERROR
max_log_size = 10MB         # حداکثر اندازه لاگ
log_rotation = daily        # چرخش روزانه

# ================================================
# 10. تنظیمات پیشرفته
# ================================================
[ADVANCED]
mtu_size = 1500             # اندازه MTU
buffer_size = 65536
compression = lz4           # فشرده‌سازی: lz4, lzo, none
fragment = false            # قطعه‌بندی
obfuscation = false         # پنهان‌سازی
connection_timeout = 30     # زمان انتظار (ثانیه)

# ================================================
# 11. تنظیمات Platform
# ================================================
[PLATFORM]
os = linux                  # linux, windows, macos, android
architecture = x86_64
version = 1.0

# ================================================
# 12. تنظیمات Firewall
# ================================================
[FIREWALL]
enable_firewall = true
allow_local_network = true  # شبکه محلی
block_ipv6 = true           # بلوک IPv6
allow_private_ips = true    # IP‌های خصوصی

# ================================================
# نمونه‌های استفاده:
# ================================================

# OpenVPN:
# sudo openvpn --config vpn-config.conf

# WireGuard:
# sudo wg-quick up ./wireguard-config.conf

# Shadowsocks:
# sslocal -c vpn-config.json

